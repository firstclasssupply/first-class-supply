<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfume | First Class Supply</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    /* HEADER */

    header {
      background: #000;
      text-align: center;
      padding: 25px 20px;
    }

    .logo {
      width: 220px;
      max-width: 80%;
    }

    nav {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 12px 22px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    nav a:hover {
      background: #d4af37;
      color: #000;
    }

    /* PRODUCT */

    .product-page {
      max-width: 1100px;
      margin: 70px auto;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .product-image {
      background: #e9e9e9;
      height: 500px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #888;
      font-size: 22px;
    }

    .product-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 12px;
}

    .product-info h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .price {
      color: #b68b00;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .description {
      color: #555;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .stock {
      font-weight: bold;
      margin-bottom: 30px;
    }

    .buy-button {
      display: inline-block;
      background: #000;
      color: #d4af37;
      padding: 16px 35px;
      text-decoration: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .buy-button:hover {
      background: #d4af37;
      color: #000;
    }

    .back {
      margin-top: 30px;
    }

    .back a {
      color: #555;
      text-decoration: none;
      font-weight: bold;
    }

    .back a:hover {
      color: #b68b00;
    }

    /* MOBILE */

    @media (max-width: 768px) {

      .product-page {
        grid-template-columns: 1fr;
        margin: 30px auto;
        gap: 30px;
      }

      .product-image {
        height: 350px;
      }

      .product-info h1 {
        font-size: 32px;
      }

      nav a {
        padding: 10px 14px;
        font-size: 13px;
      }

    }

  </style>
</head>

<body>

<header>

  <a href="index.html">
    <img src="first.PNG" class="logo" alt="First Class Supply">
  </a>

  <nav>
    <a href="perfumes.html">PERFUMES</a>
    <a href="sunglasses.html">SUNGLASSES</a>
    <a href="watches.html">WATCHES</a>
    <a href="clothing.html">CLOTHING</a>
    <a href="combos.html">COMBOS</a>
  </nav>

</header>


<main class="product-page">

  <!-- PRODUCT IMAGE -->

  <div class="product-image">
    <img src="imagination-main.png" alt="Louis Vuitton Imagination">
  </div>


  <!-- PRODUCT INFORMATION -->

  <div class="product-info">

    <h1>Louis Vuitton Imagination</h1>

    <div class="price">
      $90.00
    </div>

    <div class="description">
      Louis Vuitton Imagination Eau de Parfum 100ml.
A fresh and sophisticated fragrance with citrus, amber and woody notes.
Perfect for everyday wear and special occasions.
    </div>

    <div class="stock">
      ✓ In Stock
    </div>

    <a href="https://buy.stripe.com/00wdR2dV685t9mPfMVfnO00" class="buy-button">
      BUY NOW
    </a>

    <div class="back">
      <a href="perfumes.html">
        ← BACK TO PERFUMES
      </a>
    </div>

  </div>

</main>

</body>
</html>
