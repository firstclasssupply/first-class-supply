<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pants | First Class Supply</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 230px;
      max-width: 80%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .menu a {
      color: #d4af37;
      text-decoration: none;
      border: 2px solid #d4af37;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #d4af37;
      color: #000;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 30px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
    }

    .coming-soon-section {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px 100px;
      text-align: center;
    }

    .coming-soon-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 70px 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .coming-soon-card h2 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .coming-soon-card p {
      font-size: 18px;
      color: #666;
      line-height: 1.7;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .shop-button {
      display: inline-block;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      padding: 15px 35px;
      border-radius: 6px;
      font-weight: bold;
      border: 2px solid #000;
      transition: 0.3s;
    }

    .shop-button:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }

    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 600px) {

      header {
        padding: 18px 12px;
      }

      .logo {
        width: 200px;
      }

      .menu {
        gap: 10px;
      }

      .menu a {
        padding: 10px 15px;
        font-size: 14px;
      }

      .hero {
        padding: 50px 20px 25px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .coming-soon-section {
        padding: 25px 20px 70px;
      }

      .coming-soon-card {
        padding: 50px 20px;
      }

      .coming-soon-card h2 {
        font-size: 28px;
      }

      .coming-soon-card p {
        font-size: 16px;
      }

      .shop-button {
        width: 100%;
      }
    }
  </style>

</head>

<body>

  <header>

    <a href="index.html">
      <img src="first.PNG" alt="First Class Supply" class="logo">
    </a>

    <nav class="menu">
      <a href="boxers.html">BOXERS</a>
      <a href="pants.html">PANTS</a>
      <a href="tshirts.html">T-SHIRTS</a>
      <a href="combos.html">COMBOS</a>
    </nav>

  </header>


  <section class="hero">

    <h1>Pants</h1>

    <p>Premium streetwear styles coming soon.</p>

  </section>


  <section class="coming-soon-section">

    <div class="coming-soon-card">

      <h2>COMING SOON</h2>

      <p>
        We're adding new pants and streetwear styles to First Class Supply.
        Check back soon for new arrivals.
      </p>

      <a href="boxers.html" class="shop-button">
        SHOP BOXERS
      </a>

    </div>

  </section>


  <footer>
    <p>© 2026 First Class Supply. All Rights Reserved.</p>
  </footer>

</body>

</html>
