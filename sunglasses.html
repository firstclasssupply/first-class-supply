<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunglasses | First Class Supply</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #000;
      text-align: center;
      padding: 25px 20px;
    }

    .logo {
      width: 220px;
      max-width: 80%;
      height: auto;
    }

    .menu {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .menu a {
      color: #d4af37;
      text-decoration: none;
      border: 1px solid #d4af37;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #d4af37;
      color: #000;
    }

    .title {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .title h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .title p {
      color: #666;
      font-size: 17px;
    }

    .products {
      max-width: 1200px;
      margin: auto;
      padding: 20px 25px 70px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      height: 250px;
      background: #eeeeee;
      border-radius: 8px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #b28a17;
      font-weight: bold;
      font-size: 19px;
      margin-bottom: 15px;
    }

    .buy-button {
      display: inline-block;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 6px;
    }

    .back {
      text-align: center;
      padding-bottom: 50px;
    }

    .back a {
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="first.PNG" alt="First Class Supply" class="logo">
  </a>

  <nav class="menu">
    <a href="perfumes.html">PERFUMES</a>
    <a href="sunglasses.html">SUNGLASSES</a>
    <a href="watches.html">WATCHES</a>
    <a href="clothing.html">CLOTHING</a>
    <a href="combos.html">COMBOS</a>
  </nav>
</header>

<section class="title">
  <h1>SUNGLASSES</h1>
  <p>Discover our sunglasses collection.</p>
</section>

<section class="products">

  <div class="product">
    <div class="product-image">Product Image</div>
    <h3>Sunglasses 1</h3>
    <p class="price">$0.00</p>
    <a href="#" class="buy-button">VIEW PRODUCT</a>
  </div>

  <div class="product">
    <div class="product-image">Product Image</div>
    <h3>Sunglasses 2</h3>
    <p class="price">$0.00</p>
    <a href="#" class="buy-button">VIEW PRODUCT</a>
  </div>

  <div class="product">
    <div class="product-image">Product Image</div>
    <h3>Sunglasses 3</h3>
    <p class="price">$0.00</p>
    <a href="#" class="buy-button">VIEW PRODUCT</a>
  </div>

</section>

<div class="back">
  <a href="index.html">← BACK TO HOME</a>
</div>

</body>
</html>
