<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>T-Shirts | First Class Supply</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    /* HEADER */

    header {
      background: #000;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 230px;
      max-width: 80%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .menu a {
      color: #d4af37;
      text-decoration: none;
      border: 2px solid #d4af37;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #d4af37;
      color: #000;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 70px 20px 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
    }

    /* PRODUCTS */

    .products {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 100px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    /* CLICKABLE IMAGE */

    .product-image-link {
      display: block;
      text-decoration: none;
    }

    .product-image {
      width: 100%;
      height: 390px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.25s ease;
    }

    .product-image:hover img {
      transform: scale(1.03);
    }

    /* PRODUCT INFORMATION */

    .product-info {
      padding: 22px;
    }

    .product-title-link {
      color: #111;
      text-decoration: none;
    }

    .product-title-link:hover {
      color: #b88a00;
    }

    .product-info h2 {
      font-size: 21px;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .price {
      color: #b88a00;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .sizes {
      color: #666;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .stock {
      font-weight: bold;
      margin-bottom: 18px;
      color: #222;
    }

    /* VIEW PRODUCT BUTTON */

    .view-button {
      display: block;
      width: 100%;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      padding: 14px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      border: 2px solid #000;
      transition: 0.3s;
    }

    .view-button:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }

    /* FOOTER */

    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 25px;
    }

    /* TABLET */

    @media (max-width: 900px) {

      .products {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding: 18px 12px;
      }

      .logo {
        width: 200px;
      }

      .menu {
        gap: 10px;
      }

      .menu a {
        padding: 10px 15px;
        font-size: 14px;
      }

      .hero {
        padding: 50px 20px 25px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .products {
        grid-template-columns: 1fr;
        padding: 20px 20px 70px;
      }

      .product-image {
        height: 420px;
      }

    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header>

    <a href="index.html">
      <img
        src="first.PNG"
        alt="First Class Supply"
        class="logo">
    </a>

    <nav class="menu">

      <a href="boxers.html">
        BOXERS
      </a>

      <a href="pants.html">
        PANTS
      </a>

      <a href="tshirts.html">
        T-SHIRTS
      </a>

      <a href="combos.html">
        COMBOS
      </a>

    </nav>

  </header>


  <!-- T-SHIRTS HEADER -->

  <section class="hero">

    <h1>T-Shirts</h1>

    <p>
      Shop authentic T-shirts and streetwear from First Class Supply.
    </p>

  </section>


  <!-- PRODUCT GRID -->

  <section class="products">


    <!-- T-SHIRT 1 -->

    <div class="product-card">


      <!-- CLICK IMAGE TO OPEN PRODUCT -->

      <a
        href="tshirt1.html"
        class="product-image-link">

        <div class="product-image">

          <img
            src="true-religion-white-front.png"
            alt="True Religion Logo Patch T-Shirt White">

        </div>

      </a>


      <!-- PRODUCT INFORMATION -->

      <div class="product-info">


        <!-- CLICK NAME TO OPEN PRODUCT -->

        <a
          href="tshirt1.html"
          class="product-title-link">

          <h2>
            True Religion Logo Patch T-Shirt - White
          </h2>

        </a>


        <div class="price">
          $34.99
        </div>


        <div class="sizes">
          Sizes: M / L
        </div>


        <div class="stock">
          ✓ In Stock
        </div>


        <!-- VIEW PRODUCT -->

        <a
          href="tshirt1.html"
          class="view-button">

          VIEW PRODUCT

        </a>


      </div>

    </div>


  </section>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 First Class Supply. All Rights Reserved.
    </p>

  </footer>


</body>

</html>
