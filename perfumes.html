<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfumes | First Class Supply</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #000000;
      color: white;
      padding: 12px 20px 16px;
      text-align: center;
    }

    .logo {
      width: 175px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .menu a {
      color: #d4af37;
      text-decoration: none;
      border: 2px solid #d4af37;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }

    .menu a:hover,
    .menu a.active {
      background: #d4af37;
      color: #000000;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      background: #f4f4f4;
      text-align: center;
      padding: 55px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #666666;
      font-size: 18px;
      line-height: 1.5;
    }

    /* =========================
       PERFUMES
    ========================= */

    .products {
      padding: 60px 20px;
    }

    .product-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .product-card {
      border: 1px solid #dddddd;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      transition: 0.3s;
      text-align: center;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: #d4af37;
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
    }

    .product-image {
      width: 100%;
      height: 300px;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999999;
      font-weight: bold;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 20px;
    }

    .product-info {
      padding: 24px;
    }

    .product-info h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .size {
      color: #777777;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .buy-button {
      display: block;
      width: 100%;
      background: #000000;
      color: #d4af37;
      text-decoration: none;
      border: 2px solid #000000;
      padding: 13px 20px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }

    .buy-button:hover {
      background: #d4af37;
      color: #000000;
      border-color: #d4af37;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #000000;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 10px 12px 14px;
      }

      .logo {
        width: 150px;
      }

      .menu {
        gap: 8px;
      }

      .menu a {
        padding: 9px 12px;
        font-size: 12px;
      }

      .hero {
        padding: 40px 18px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .hero p {
        font-size: 16px;
      }

      .products {
        padding: 40px 18px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 330px;
      }

    }

  </style>

</head>


<body>

  <!-- HEADER -->

  <header>

    <a href="index.html">
      <img
        src="first.PNG"
        alt="First Class Supply"
        class="logo">
    </a>

    <nav class="menu">

      <a href="perfumes.html" class="active">
        PERFUMES
      </a>

      <a href="boxers.html">
        BOXERS
      </a>

      <a href="tshirts.html">
        T-SHIRTS
      </a>

      <a href="pants.html">
        PANTS
      </a>

      <a href="combos.html">
        COMBOS
      </a>

    </nav>

  </header>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Designer Fragrances
    </h1>

    <p>
      Shop authentic fragrances at First Class Supply.
    </p>

  </section>


  <!-- PRODUCTS -->

  <section class="products">

    <div class="product-grid">


      <!-- PRODUCT 1 -->

      <div class="product-card">

        <div class="product-image">
          PRODUCT IMAGE
        </div>

        <div class="product-info">

          <h2>
            Product 1
          </h2>

          <p class="size">
            Size
          </p>

          <p class="price">
            $0.00
          </p>

          <a href="#" class="buy-button">
            BUY NOW
          </a>

        </div>

      </div>


    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 First Class Supply. All Rights Reserved.
    </p>

  </footer>


</body>

</html>
