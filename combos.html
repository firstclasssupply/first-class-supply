<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Combos | First Class Supply</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    /* HEADER */

    header {
      background: #000;
      padding: 12px 20px 16px;
      text-align: center;
    }

    .logo {
      width: 175px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .menu a {
      color: #d4af37;
      text-decoration: none;
      border: 2px solid #d4af37;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #d4af37;
      color: #000;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
    }

    /* COMING SOON */

    .coming-soon-section {
      max-width: 900px;
      margin: auto;
      padding: 20px 20px 80px;
      text-align: center;
    }

    .coming-soon-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 55px 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .coming-soon-card h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .coming-soon-card p {
      font-size: 18px;
      color: #666;
      line-height: 1.7;
      max-width: 620px;
      margin: 0 auto 30px;
    }

    .shop-button {
      display: inline-block;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 6px;
      font-weight: bold;
      border: 2px solid #000;
      transition: 0.3s;
    }

    .shop-button:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }

    /* FOOTER */

    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 25px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding: 10px 12px 14px;
      }

      .logo {
        width: 150px;
        margin-bottom: 10px;
      }

      .menu {
        gap: 8px;
      }

      .menu a {
        padding: 9px 13px;
        font-size: 13px;
      }

      .hero {
        padding: 30px 20px 15px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .coming-soon-section {
        padding: 15px 20px 60px;
      }

      .coming-soon-card {
        padding: 45px 20px;
      }

      .coming-soon-card h2 {
        font-size: 27px;
      }

      .coming-soon-card p {
        font-size: 16px;
      }

      .shop-button {
        width: 100%;
      }

    }

  </style>

</head>

<body>


  <!-- HEADER -->

  <header>

    <a href="index.html">
      <img
        src="first.PNG"
        alt="First Class Supply"
        class="logo">
    </a>

    <nav class="menu">

      <a href="boxers.html">
        BOXERS
      </a>

      <a href="tshirts.html">
        T-SHIRTS
      </a>

      <a href="pants.html">
        PANTS
      </a>

      <a href="combos.html">
        COMBOS
      </a>

    </nav>

  </header>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Combos
    </h1>

    <p>
      Bundle your favorites. Save more.
    </p>

  </section>


  <!-- COMING SOON -->

  <section class="coming-soon-section">

    <div class="coming-soon-card">

      <h2>
        NEW COMBOS COMING SOON
      </h2>

      <p>
        We're creating special bundles with your favorite
        First Class Supply products. Stay tuned for new combo
        deals and exclusive savings.
      </p>

      <a
        href="boxers.html"
        class="shop-button">

        SHOP BOXERS

      </a>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 First Class Supply. All Rights Reserved.
    </p>

  </footer>


</body>

</html>
