<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Combos | First Class Supply</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      background: #000000;
      padding: 25px;
      text-align: center;
    }

    .logo {
      width: 220px;
      max-width: 80%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .menu {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .menu a {
      color: #d4af37;
      text-decoration: none;
      border: 1px solid #d4af37;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #d4af37;
      color: #000000;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 45px;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #666666;
      font-size: 18px;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .product {
      border: 1px solid #dddddd;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      background: #ffffff;
    }

    .product-image {
      height: 260px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      border-radius: 8px;
      color: #888888;
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .buy-button {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 6px;
    }

    .buy-button:hover {
      background: #d4af37;
      color: #000000;
    }

    .back {
      text-align: center;
      margin: 50px 0;
    }

    .back a {
      color: #111111;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 34px;
      }
    }
  </style>

</head>

<body>

  <header>

    <img src="first.PNG" alt="First Class Supply" class="logo">

    <nav class="menu">
      <a href="perfumes.html">PERFUMES</a>
      <a href="sunglasses.html">SUNGLASSES</a>
      <a href="watches.html">WATCHES</a>
      <a href="clothing.html">CLOTHING</a>
      <a href="combos.html">COMBOS</a>
    </nav>

  </header>

  <section class="hero">

    <h1>Combos</h1>

    <p>Exclusive First Class Supply bundles.</p>

  </section>

  <section class="products">

    <div class="product-grid">

      <div class="product">
        <div class="product-image">Combo Image</div>
        <h3>Combo 1</h3>
        <p class="price">$0.00</p>
        <a href="#" class="buy-button">VIEW COMBO</a>
      </div>

      <div class="product">
        <div class="product-image">Combo Image</div>
        <h3>Combo 2</h3>
        <p class="price">$0.00</p>
        <a href="#" class="buy-button">VIEW COMBO</a>
      </div>

      <div class="product">
        <div class="product-image">Combo Image</div>
        <h3>Combo 3</h3>
        <p class="price">$0.00</p>
        <a href="#" class="buy-button">VIEW COMBO</a>
      </div>

    </div>

  </section>

  <div class="back">
    <a href="index.html">← BACK TO HOME</a>
  </div>

</body>

</html>
